services:

  mcp:
    build: .
    image: phes-odm-search-mcp:latest
    restart: unless-stopped
    environment:
      ODM_HOST: "0.0.0.0"
      ODM_PORT: "8000"
    expose:
      - "8000"
    # Uncomment the lines below to persist a rebuilt embeddings index on disk
    # rather than using the copy baked into the image.
    # volumes:
    #   - embeddings:/app/embeddings

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - mcp

  # Used once to obtain a Let's Encrypt TLS certificate (see DOCKER.md).
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  certbot-www:
  certbot-conf:
  # embeddings:
