services:

  mcp:
    build: .
    image: phes-odm-search-mcp:latest
    restart: unless-stopped
    environment:
      ODM_TRANSPORT: "http"
      ODM_HOST: "0.0.0.0"
      ODM_PORT: "3840"
    ports:
      - "3840:3840"
    # Uncomment the lines below to persist a rebuilt embeddings index on disk
    # rather than using the copy baked into the image.
    # volumes:
    #   - embeddings:/app/embeddings

# volumes:
#   embeddings:
