# HTTP — serves the MCP endpoint and handles ACME challenges for Certbot.
# After obtaining a TLS certificate, uncomment the HTTPS server block below
# and reload nginx (see DOCKER.md for the full TLS setup).
server {
    listen 80;
    server_name _;

    # ACME challenge endpoint used by Certbot to verify domain ownership.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy all other traffic to the MCP server.
    # Change to a redirect once TLS is active:
    #   return 301 https://$host$request_uri;
    location / {
        proxy_pass         http://mcp:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

