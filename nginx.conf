# Reverse proxy for the PHES-ODM Search MCP server.
#
# This config is for running the server as a plain service on a host (see
# SERVER.md) — not for Docker Compose, which publishes port 3840 directly.
# Install it as an nginx virtual host:
#
#   sudo cp nginx.conf /etc/nginx/sites-available/PHES-ODM-Search-MCP
#
# then edit server_name below, enable the site, and reload nginx. Running
# `sudo certbot --nginx -d your.domain.example` adds the TLS listener and
# certificate directives to this file automatically.

server {
    listen 80;

    # Replace with your server's public IP address or DNS name.
    server_name your.domain.example;

    location / {
        proxy_pass         http://127.0.0.1:3840;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The SSE transport (--transport sse) streams responses, so nginx must
        # not buffer them. Uncomment these two lines if you use SSE; they are
        # harmless but unnecessary for the default streamable HTTP transport.
        # proxy_buffering    off;
        # proxy_read_timeout 24h;
    }
}
